<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Values</title>
    <!-- Подключаем жирный современный шрифт Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #191B20;
            height: 100vh;
            display: flex;
            box-sizing: border-box;
            padding: 24px;
            gap: 24px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        .sidebar {
            width: 260px;
            height: 100%;
            background-color: #1E2028;
            border-radius: 16px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            box-sizing: border-box;
            gap: 8px;
            overflow-y: auto;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #8A8D98;
            text-align: left;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.04);
            color: #FFFFFF;
        }

        .nav-btn.active {
            background-color: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
        }

        .main-content {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow: hidden;
        }

        .top-bar {
            width: 100%;
            height: 80px;
            background-color: #1E2028;
            border-radius: 16px;
            margin: 0 auto;
            max-width: calc(100% - 40px);
            flex-shrink: 0;
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            max-width: calc(100% - 40px);
            margin: 0 auto;
            width: 100%;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding-bottom: 24px;
        }

        /* Стили карточек */
        .card {
            background-color: #1E2028;
            border-radius: 16px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            color: #FFFFFF;
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            text-align: center;
        }

        .card:hover {
            background-color: #252833;
            transform: translateY(-4px);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <button class="nav-btn active" onclick="switchTab('sets', this)">Sets</button>
        <button class="nav-btn" onclick="switchTab('uniques', this)">Uniques</button>
        <button class="nav-btn" onclick="switchTab('evos', this)">Evos</button>
        <button class="nav-btn" onclick="switchTab('ancients', this)">Ancients</button>
        <button class="nav-btn" onclick="switchTab('vintages', this)">Vintages</button>
        <button class="nav-btn" onclick="switchTab('chromas', this)">Chromas</button>
        <button class="nav-btn" onclick="switchTab('godlies', this)">Godlies</button>
        <button class="nav-btn" onclick="switchTab('legendaries', this)">Legendaries</button>
        <button class="nav-btn" onclick="switchTab('rares', this)">Rares</button>
        <button class="nav-btn" onclick="switchTab('uncommons', this)">Uncommons</button>
        <button class="nav-btn" onclick="switchTab('commons', this)">Commons</button>
    </div>
    
    <div class="main-content">
        <div class="top-bar"></div>
        <div class="content-area">
            <!-- Sets -->
            <div id="sets" class="tab-content active">
                <div class="card"><div class="card-title">Nik's Scythe</div></div>
                <div class="card"><div class="card-title">Gingerscope</div></div>
                <div class="card"><div class="card-title">Traveler's Axe</div></div>
                <div class="card"><div class="card-title">Celestial</div></div>
                <div class="card"><div class="card-title">Vampire's Axe</div></div>
                <div class="card"><div class="card-title">Harvester</div></div>
                <div class="card"><div class="card-title">Icepiercer</div></div>
            </div>
            <!-- Uniques -->
            <div id="uniques" class="tab-content">
                <div class="card"><div class="card-title">Icebreaker</div></div>
                <div class="card"><div class="card-title">Batwing</div></div>
            </div>
            <!-- Evos -->
            <div id="evos" class="tab-content">
                <div class="card"><div class="card-title">Elderwood Scythe</div></div>
                <div class="card"><div class="card-title">Swirly Axe</div></div>
            </div>
            <!-- Ancients -->
            <div id="ancients" class="tab-content">
                <div class="card"><div class="card-title">Hallowscythe</div></div>
            </div>
            <!-- Vintages -->
            <div id="vintages" class="tab-content">
                <div class="card"><div class="card-title">Logchopper</div></div>
                <div class="card"><div class="card-title">Icewing</div></div>
            </div>
            <!-- Chromas -->
            <div id="chromas" class="tab-content"></div>
            <!-- Godlies -->
            <div id="godlies" class="tab-content"></div>
            <!-- Legendaries -->
            <div id="legendaries" class="tab-content"></div>
            <!-- Rares -->
            <div id="rares" class="tab-content"></div>
            <!-- Uncommons -->
            <div id="uncommons" class="tab-content"></div>
            <!-- Commons -->
            <div id="commons" class="tab-content"></div>
        </div>
    </div>

    <script>
        function switchTab(tabId, buttonElement) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            buttonElement.classList.add('active');

            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
