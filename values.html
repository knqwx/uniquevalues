<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Values</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #191B20;
            height: 100vh;
            display: flex;
            box-sizing: border-box;
            padding: 24px;
            gap: 24px;
        }

        .sidebar {
            width: 260px;
            height: 100%;
            background-color: #1C1E26;
            border-radius: 16px;
            flex-shrink: 0;
        }

        .main-content {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .top-bar {
            width: 100%;
            height: 80px;
            background-color: #1C1E26;
            border-radius: 16px;
            margin: 0 auto;
            max-width: calc(100% - 40px);
        }
    </style>
</head>
<body>
    <div class="sidebar"></div>
    <div class="main-content">
        <div class="top-bar"></div>
    </div>
</body>
</html>
