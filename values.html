<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Values</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #191B20;
            height: 100vh;
            display: flex;
            box-sizing: border-box;
            padding: 24px;
            gap: 24px;
        }

        .sidebar {
            width: 260px;
            height: 100%;
            background-color: #1E2028;
            border-radius: 16px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            box-sizing: border-box;
            gap: 8px;
            overflow-y: auto;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #8A8D98;
            text-align: left;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.04);
            color: #FFFFFF;
        }

        .nav-btn.active {
            background-color: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
        }

        .main-content {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .top-bar {
            width: 100%;
            height: 80px;
            background-color: #1E2028;
            border-radius: 16px;
            margin: 0 auto;
            max-width: calc(100% - 40px);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <button class="nav-btn active">Sets</button>
        <button class="nav-btn">Uniques</button>
        <button class="nav-btn">Evos</button>
        <button class="nav-btn">Ancients</button>
        <button class="nav-btn">Vintages</button>
        <button class="nav-btn">Chromas</button>
        <button class="nav-btn">Godlies</button>
        <button class="nav-btn">Legendaries</button>
        <button class="nav-btn">Rares</button>
        <button class="nav-btn">Uncommons</button>
        <button class="nav-btn">Commons</button>
    </div>
    <div class="main-content">
        <div class="top-bar"></div>
    </div>
</body>
</html>
